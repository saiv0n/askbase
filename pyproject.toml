[project]
name = "askbase"
version = "0.1.0"
description = "A support chatbot that answers from your own documents, with sources, embeddable on any site"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
claude = [
    "anthropic>=2.0",
]

[project.scripts]
askbase = "askbase.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "respx>=0.21"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["src/askbase/static/**"]
